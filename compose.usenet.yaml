services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    ports:
      - "127.0.0.1:9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${BOOKSTACK_INSTALL}/prowlarr/config:/config
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping >/dev/null || wget -q --spider http://127.0.0.1:9696/ping" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=false"

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${BOOKSTACK_INSTALL}/sabnzbd:/config
      - ${BOOK_INCOMPLETE}:/incomplete-downloads
      - ${BOOK_LIBRARY}:/downloads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null || wget -q --spider http://127.0.0.1:8080/" ]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      - "traefik.enable=false"
