<!DOCTYPE html>
<html lang="en">

<head>
    <!-- bookstack-ui-build: request-auto-releases -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.5">
    <title>BookStack</title>
    <style>
        /* RESET & VIEWPORT */
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background: #d9d9d9;
            color: #000000;
            font-size: 20px;
        }

        #app-layout {
            display: table;
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #d9d9d9;
        }

        .layout-row {
            display: table-row;
        }

        #context-bar-cell {
            height: 45px;
            border-bottom: 2px solid #000;
            background: #000;
            color: #fff;
            vertical-align: middle;
        }

        #content-area-cell {
            height: 100%;
            width: 100%;
            vertical-align: top;
            padding: 5px;
            overflow: hidden;
            background: #d9d9d9;
        }

        .ctx-table {
            width: 100%;
            border-collapse: collapse;
        }

        .ctx-left {
            width: 33%;
            overflow: hidden;
        }

        .ctx-right {
            width: 33%;
            text-align: right;
            overflow: hidden;
        }

        .ctx-center {
            width: 34%;
            text-align: center;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            color: #fff;
        }

        .btn {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            font-weight: bold;
            font-size: 18px;
            padding: 5px 10px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 0;
            min-height: 35px;
            max-width: 100%;
            display: inline-block;
            appearance: none;
            -webkit-appearance: none;
        }

        .btn:active {
            background: #000;
            color: #fff;
        }

        .btn:disabled {
            border-color: #999;
            color: #999;
        }

        .opds-item {
            border: 1px solid #000;
            margin-bottom: 4px;
            padding: 4px;
            background: #fff;
            display: block;
            overflow: hidden;
            width: 100%;
        }

        .card,
        .detail-card {
            background: #fff;
            border: 1px solid #000;
            padding: 8px;
            width: 100%;
            overflow: hidden;
        }

        .menu-desc {
            color: #666;
            font-size: 16px;
            line-height: 18px;
        }

        .section-note {
            color: #666;
            margin: 0 0 8px 0;
            font-size: 18px;
            line-height: 22px;
        }

        .book-row {
            border: 1px solid #000;
            margin-bottom: 4px;
            padding: 0;
            background: #fff;
            display: table;
            table-layout: fixed;
            height: 92px;
            overflow: hidden;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
        }

        .book-cover {
            display: table-cell;
            vertical-align: top;
            width: 70px;
            padding-right: 5px;
        }

        .book-info {
            display: table-cell;
            vertical-align: top;
            height: 90px;
            overflow: hidden;
        }

        .book-cover img {
            width: 60px;
            height: 90px;
            border: 1px solid #000;
            display: block;
            margin: 0;
            cursor: pointer;
            box-sizing: border-box;
        }

        .book-cover .btn {
            width: 60px !important;
            height: 90px !important;
            padding: 0;
            box-sizing: border-box;
        }

        .book-title {
            font-weight: bold;
            font-size: 20px;
            line-height: 21px;
            margin: 0;
            height: 21px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .book-title a {
            color: #000;
            text-decoration: none;
            display: block;
            margin: 0;
            padding: 0;
            line-height: 21px;
        }

        .book-meta {
            margin: 0;
            padding: 0;
            font-style: italic;
            line-height: 18px;
            height: 18px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .book-status {
            margin: 0;
            padding: 0;
            font-size: 16px;
            font-weight: bold;
            line-height: 18px;
            height: 18px;
            overflow: hidden;
        }

        .book-description {
            margin: 0;
            padding: 0;
            font-size: 18px;
            line-height: 16px;
            color: #333;
            text-decoration: none;
            overflow: hidden;
            height: 32px;
            display: block;
        }

        a.book-description,
        a.book-description:visited,
        a.book-description:active {
            color: #333;
            text-decoration: none;
        }

        .book-description a {
            color: #333;
            text-decoration: none;
            display: block;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #d9d9d9;
            z-index: 9999;
            display: none;
            padding: 20px;
            border: 5px solid #000;
        }

        .modal-content {
            height: 80%;
            width: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            font-size: 24px;
            border-bottom: 2px solid #000;
            margin-bottom: 10px;
            background: #fff;
            padding: 8px;
        }

        #confirm-modal > div {
            background: #fff;
            border: 2px solid #000;
            padding: 10px;
        }

        input[type="text"] {
            width: 100%;
            border: 2px solid #000;
            padding: 8px;
            font-size: 20px;
            border-radius: 0;
            margin-bottom: 5px;
            box-sizing: border-box;
        }

        select {
            width: 100%;
            border: 2px solid #000;
            padding: 8px;
            font-size: 20px;
            border-radius: 0;
            margin-bottom: 5px;
            background: #fff;
        }

        .filter-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 0;
        }

        .filter-table td {
            vertical-align: top;
            padding: 0 4px 0 0;
        }

        .filter-table td:last-child {
            padding-right: 0;
        }

        .filter-table select,
        .filter-table .btn {
            height: 42px;
            margin-bottom: 0;
            padding-top: 4px;
            padding-bottom: 4px;
        }

        #book-detail-description {
            clear: both;
            max-height: 150px;
            overflow: hidden;
            margin: 6px 0 4px 0;
            line-height: 20px;
        }

        .book-detail-summary {
            min-height: 152px;
            overflow: hidden;
            width: 100%;
        }

        #book-detail-action {
            clear: both;
            padding-top: 4px;
        }

        .hidden {
            display: none !important;
        }

        #message-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 10px 20px;
            z-index: 10000;
            font-weight: bold;
            max-width: 90%;
            text-align: center;
        }

        #content-area,
        #content-area > div {
            width: 100%;
            max-width: 100%;
        }

        #content-area > div {
            height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        @media screen and (max-width: 480px) {
            body {
                font-size: 18px;
            }

            .btn {
                font-size: 16px;
                padding-left: 6px;
                padding-right: 6px;
            }

            .section-note,
            .book-description {
                font-size: 16px;
            }

            .modal-overlay {
                padding: 10px;
                border-width: 3px;
            }

            .modal-content {
                font-size: 20px;
            }
        }

        @media screen and (max-height: 500px) {
            #context-bar-cell {
                height: 40px;
            }

            .modal-content {
                height: 72%;
            }
        }

        /* Marketplace theme. Conservative CSS keeps older e-reader browsers usable. */
        body, #app-layout, #content-area-cell { background: #f3f0e8; }
        #context-bar-cell { height: 50px; background: #17212b; border-bottom: 0; }
        .ctx-table { height: 50px; }
        .ctx-left, .ctx-right { width: 28%; padding: 0 8px; }
        .ctx-center { width: 44%; font-family: Georgia, serif; font-size: 22px; letter-spacing: .3px; }
        #context-bar-cell .btn { min-height: 32px; padding: 3px 8px; color: #fff; background: transparent; border: 1px solid #aeb7bf; font-size: 14px; }
        #market-nav-cell { height: 48px; padding: 0; background: #fff; border-bottom: 1px solid #8e8e8e; vertical-align: middle; }
        .market-nav { width: 100%; height: 48px; border-collapse: collapse; table-layout: fixed; }
        .market-nav td { padding: 0; border-right: 1px solid #b9b9b9; text-align: center; }
        .market-nav td:last-child { border-right: 0; }
        .market-nav button { width: 100%; height: 47px; padding: 3px 2px; border: 0; border-bottom: 4px solid transparent; background: #fff; color: #17212b; font: bold 14px sans-serif; text-transform: uppercase; cursor: pointer; }
        .market-nav button.active { color: #8b3e20; border-bottom-color: #c65d32; background: #faf7f1; }
        #content-area-cell { padding: 10px; }
        .section-note { padding: 10px 12px; margin-bottom: 10px; color: #353535; background: #fff; border-left: 5px solid #c65d32; font-family: Georgia, serif; }
        .opds-item, .card, .detail-card { border: 1px solid #aaa69d; background: #fff; box-shadow: 0 1px 0 #d4d0c8; }
        .opds-item { min-height: 58px; margin-bottom: 7px; padding: 9px 12px; border-left: 5px solid #17212b; cursor: pointer; }
        .opds-item b { font-family: Georgia, serif; font-size: 19px; }
        .menu-desc { color: #66635d; font-size: 15px; }
        .book-row { position: relative; height: 148px; margin-bottom: 8px; border: 1px solid #aaa69d; border-left: 5px solid #17212b; background: #fff; box-shadow: 0 1px 0 #d4d0c8; }
        .book-cover { width: 100px; padding: 7px 7px 7px 6px; background: #e8e4dc; }
        .book-cover img, .book-cover .btn { width: 88px !important; height: 132px !important; }
        .book-info { height: 146px; padding: 7px 10px 5px 4px; }
        .book-title, .book-title a { height: 24px; padding-right: 105px; font-family: Georgia, serif; font-size: 21px; line-height: 24px; }
        .book-meta { height: 19px; color: #5f5b55; font-size: 15px; line-height: 19px; }
        .book-status { position: absolute; top: 7px; right: 9px; display: inline-block; width: auto; height: 21px; margin: 0; padding: 1px 7px; color: #fff; background: #586a36; font-size: 12px; line-height: 19px; letter-spacing: .4px; }
        .book-description { height: 68px; color: #4e4b46; font-size: 15px; line-height: 17px; }
        .detail-card { position: relative; max-width: 920px; margin: 0 auto; padding: 14px; border-top: 6px solid #17212b; }
        .detail-card h2 { margin: 0 0 4px 0; padding-right: 115px; font-family: Georgia, serif; font-size: 32px; line-height: 35px; }
        .detail-cover { width: 130px; height: 195px; float: left; margin: 0 16px 10px 0; border: 1px solid #777; }
        .book-detail-summary { min-height: 207px; }
        .detail-author { margin: 0 0 8px 0; color: #5c3a2b; font-family: Georgia, serif; font-size: 21px; font-style: italic; }
        .detail-facts { margin: 0 0 8px 0; color: #57534d; font-size: 16px; line-height: 21px; }
        .detail-status-wrap { position: absolute; top: 12px; right: 14px; margin: 0; }
        .detail-availability { display: inline-block; margin: 0; padding: 4px 9px; color: #fff; background: #586a36; font-size: 14px; letter-spacing: .4px; }
        #book-detail-description { height: 200px; max-height: 200px; line-height: 20px; overflow: hidden; }
        #book-detail-description { padding-top: 8px; border-top: 1px solid #c8c3ba; font-family: Georgia, serif; }
        .btn { border: 1px solid #17212b; background: #fff; color: #17212b; font-size: 16px; }
        #book-detail-action .btn { background: #c65d32; border-color: #8b3e20; color: #fff; }
        input[type="text"], select { border-color: #77736c; background: #fffefb; }
        @media screen and (max-width: 600px) {
            .ctx-left, .ctx-right { width: 25%; padding: 0 3px; }
            .ctx-center { width: 50%; font-size: 16px; }
            .market-nav button { font-size: 11px; }
            #content-area-cell { padding: 5px; }
            .book-row { height: 140px; }
            .book-info { height: 138px; padding-right: 5px; }
            .book-title, .book-title a { padding-right: 82px; font-size: 18px; }
            .book-description { height: 64px; font-size: 14px; line-height: 16px; }
            .book-cover { width: 92px; }
            .book-cover img, .book-cover .btn { width: 80px !important; height: 120px !important; }
            .book-status { right: 5px; padding-left: 5px; padding-right: 5px; font-size: 10px; }
            .detail-cover { width: 100px; height: 150px; margin-right: 10px; }
            .book-detail-summary { min-height: 162px; }
            .detail-card h2 { padding-right: 90px; font-size: 25px; line-height: 28px; }
            .detail-status-wrap { top: 10px; right: 10px; }
            .detail-availability { padding: 3px 6px; font-size: 11px; }
        }
        #context-bar-row { display: none; }
        #context-bar-cell { height: 38px; padding: 0; background: #fff; color: #17212b; border-bottom: 1px solid #aaa69d; vertical-align: middle; }
        #context-bar-cell .ctx-table { height: 38px; }
        #context-bar-cell .ctx-left { width: 28%; padding-left: 6px; }
        #context-bar-cell .ctx-center { width: 72%; padding-right: 10px; color: #17212b; font-family: Georgia, serif; font-size: 17px; text-align: right; }
        #context-bar-cell .ctx-right { display: none; }
        #context-bar-cell .btn { min-height: 30px; padding: 2px 8px; border: 0; background: #fff; color: #17212b; font-size: 14px; text-align: left; }
        #bottom-bar-cell { height: 54px; padding: 0; background: #fff; border-top: 1px solid #777; vertical-align: middle; }
        .bottom-bar { width: 100%; height: 54px; border-collapse: collapse; table-layout: fixed; }
        .bottom-bar td { padding: 0; text-align: center; vertical-align: middle; }
        .bottom-bar button { width: 100%; height: 52px; border: 0; background: #fff; color: #111; font-size: 28px; cursor: pointer; }
        .bottom-bar button:disabled { color: #aaa; }
        .bottom-section-cell { width: 18%; padding: 5px 3px !important; }
        .bottom-bar .bottom-section-button { height: 40px; border: 2px solid #111; font-size: 13px; font-weight: bold; }
        .bottom-page { width: 28%; font-size: 14px; font-weight: bold; white-space: nowrap; }
        #main-menu { position: fixed; left: 8px; bottom: 58px; z-index: 9000; width: 230px; padding: 5px; background: #fff; border: 2px solid #17212b; box-shadow: 3px 3px 0 #777; }
        #main-menu .btn { width: 100%; margin-bottom: 4px; text-align: left; }
        .market-nav button { font-size: 13px; }
        .author-card, .series-card { display: inline-block; width: 24%; min-height: 220px; margin: 0 .5% 8px .5%; padding: 9px; border-left-width: 1px; vertical-align: top; text-align: center; }
        .author-photo { display: block; position: static; width: 105px; height: 135px; margin: 0 auto 8px auto; border: 1px solid #777; object-fit: cover; background: #e8e4dc; }
        .tile-title { display: block; height: 42px; overflow: hidden; font-family: Georgia, serif; font-size: 17px; line-height: 21px; }
        .series-card { min-height: 240px; }
        .series-stack { position: relative; display: block; left: auto; top: auto; width: 112px; height: 142px; margin: 7px auto 5px auto; }
        .series-stack img { position: absolute; width: 82px; height: 125px; border: 1px solid #555; background: #ddd; }
        .series-stack .stack-1 { left: 0; top: 12px; }
        .series-stack .stack-2 { left: 14px; top: 6px; }
        .series-stack .stack-3 { left: 28px; top: 0; }
        .series-author { display: block; height: 34px; overflow: hidden; color: #666; font-size: 14px; font-style: italic; line-height: 17px; }

        #library-search-card { max-width: 720px; margin: 10px auto; }
        @media screen and (max-width: 700px) { .author-card, .series-card { width: 32.33%; } }
        @media screen and (max-width: 480px) {
            .market-nav button { font-size: 10px; } .bottom-bar button { font-size: 23px; } .bottom-page { font-size: 12px; }
            .author-card, .series-card { width: 49%; margin-left: .5%; margin-right: .5%; }
        }

        @media screen and (max-height: 500px) {
            #market-nav-cell, .market-nav { height: 40px; }
            .market-nav button { height: 39px; }
        }
    </style>
</head>

<body>
    <table id="app-layout">
        <tr class="layout-row">
            <td id="market-nav-cell">
                <table class="market-nav" aria-label="Section navigation">
                    <tr id="primary-nav-row"></tr>
                </table>
            </td>
        </tr>
        <tr id="context-bar-row" class="layout-row">
            <td id="context-bar-cell">
                <table class="ctx-table">
                    <tr>
                        <td id="ctx-left" class="ctx-left"></td>
                        <td id="ctx-center" class="ctx-center"></td>
                        <td id="ctx-right" class="ctx-right"></td>
                    </tr>
                </table>
            </td>
        </tr>
        <tr class="layout-row">
            <td id="content-area-cell">
                <div id="content-area" style="height:100%; overflow:hidden; position:relative;">
                    <div id="view-discover">
                        <div id="discovery-content">Loading...</div>
                    </div>
                    <div id="view-cloud" class="hidden">
                        <div id="opds-content">Loading...</div>
                    </div>
                    <div id="view-search" class="hidden">
                        <div id="search-input-container" class="card"
                            style="padding: 5px; border-bottom: 1px solid #000;">
                            <h3 style="margin:0 0 5px 0;">Find Books</h3>
                            <input type="text" id="search-input" placeholder="Title or author..."
                                onkeypress="if(event.keyCode==13) performSearch()">
                            <button type="button" class="btn" style="width:100%"
                                onclick="performSearch()">SEARCH</button>
                        </div>
                        <div id="search-results"></div>
                    </div>
                    <div id="view-queue" class="hidden">
                        <div id="queue-list"></div>
                    </div>
                    <div id="view-settings" class="hidden">
                        <div class="card" style="padding:10px;">
                            <h3>Kindle Settings</h3>
                            <p>Enter your "Send to Kindle" email address:</p>
                            <input type="text" id="kindle-email" placeholder="example@kindle.com">
                            <button type="button" class="btn" style="width:100%; margin-top:10px;"
                                onclick="saveSettings()">SAVE
                                SETTINGS</button>
                        </div>
                    </div>
                    <div id="bsio-search-container" class="hidden"></div>
                    <div id="releases-container" class="hidden"></div>
                </div>
            </td>
        </tr>
        <tr class="layout-row">
            <td id="bottom-bar-cell">
                <table class="bottom-bar" aria-label="Section and page navigation"><tr>
                    <td class="bottom-section-cell"><button type="button" id="current-section-button" class="bottom-section-button" onclick="toggleMainMenu()" aria-label="Open main menu">LIBRARY</button></td>
                    <td><button type="button" id="page-first" onclick="goToPage('first')" aria-label="First page">&laquo;</button></td>
                    <td><button type="button" id="page-prev" onclick="goToPage('prev')" aria-label="Previous page">&lsaquo;</button></td>
                    <td class="bottom-page"><span id="bottom-page-label">Page 1 of 1</span></td>
                    <td><button type="button" id="page-next" onclick="goToPage('next')" aria-label="Next page">&rsaquo;</button></td>
                    <td><button type="button" id="page-last" onclick="goToPage('last')" aria-label="Last page">&raquo;</button></td>
                </tr></table>
            </td>
        </tr>
    </table>

    <div id="main-menu" class="hidden">
        <button type="button" class="btn" onclick="closeMainMenu(); openLibrarySection('recent')">LIBRARY</button>
        <button type="button" class="btn" onclick="closeMainMenu(); switchTab('discover')">STORE</button>
        <button type="button" class="btn" onclick="closeMainMenu(); switchTab('queue')">DOWNLOADS</button>
        <button type="button" class="btn" onclick="closeMainMenu(); switchTab('settings')">SETTINGS</button>
    </div>

    <div id="desc-modal" class="modal-overlay">

        <div class="modal-content" id="modal-text"></div>
        <button type="button" class="btn" style="width:100%; height: 50px;" onclick="closeModal()">CLOSE</button>
    </div>

    <div id="confirm-modal" class="modal-overlay" style="display:none;">
        <div style="text-align:center; padding-top:20px;">
            <p id="confirm-text" style="font-size:24px; font-weight:bold; margin-bottom:20px;">Send to Kindle?</p>
            <button type="button" id="confirm-yes-btn" class="btn" onclick="sendConfirmToKindle()"
                style="width:100%; height: 50px; margin-bottom:10px; background:#000; color:#fff;">SEND</button>
            <button type="button" class="btn" style="width:100%; height: 50px;"
                onclick="closeConfirmModal()">CANCEL</button>
        </div>
    </div>

    <div id="message-toast" class="hidden"></div>

    <script>
        // Global State
        window.confirmUrl = null;
        var currentTab = 'cloud';
        var lastMainTab = 'cloud';
        var librarySection = 'recent';
        var storeSection = 'trending';
        var storeGenres = ['', 'Fantasy', 'Science Fiction', 'Romance', 'Mystery', 'Thriller', 'Horror', 'Historical Fiction', 'Young Adult', 'Biography', 'History', 'Nonfiction'];
        var storeSelection = { trending: { genre: '', period: 'all' }, popular: { genre: '', period: 'all' }, author: { genre: '', period: 'any', query: '' }, book: { genre: '', period: 'any', query: '' } };
        var opdsHistory = [];
        var opdsData = [];
        var paginationState = {
            items: [],
            currentPage: 0,
            pageSize: 10,
            title: '',
            backAction: null,
            itemRenderer: null,
            targetId: 'opds-content',
            footerRenderer: null
        };
        var searchStateBackup = null;
        var searchReturnAction = null;
        var discoveryListState = null;
        var discoverySelectedBook = null;
        var hardcoverGenres = null;
        var hardcoverSelection = {
            trending: { period: 'now', genre: '' },
            newReleases: { genre: '' }
        };
        var contextTitle = 'Home';

        function fitViewport() {

        function cleanString(s) {
            if (s === null || s === undefined) return '';
            var str = String(s).trim();
            var changed = true;
            while (changed) {
                changed = false;
                var lower = str.toLowerCase();
                if (lower.indexOf('undefined') === 0) { str = str.substring(9).trim(); changed = true; }
                else if (lower.indexOf('null') === 0) { str = str.substring(4).trim(); changed = true; }
            }
            if (str.toLowerCase() === 'undefined' || str.toLowerCase() === 'null') return '';
            return str;
        }

        function escapeHtml(value) {
            return String(value === null || value === undefined ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        var ajaxResponseCache = {};
        function ajax(method, path, data, callback, timeoutMs) {
            var cacheable = method === 'GET' && path.indexOf('/api/settings') !== 0 && path.indexOf('/api/shelfmark/queue') !== 0;
            var cached = cacheable ? ajaxResponseCache[path] : null;
            if (cached && cached.expires > new Date().getTime()) {
                setTimeout(function () { callback(null, cached.data); }, 0);
                return null;
            }
            var xhr = new XMLHttpRequest();
            var completed = false;
            function finish(err, payload) {
                if (completed) return;
                completed = true;
                callback(err, payload);
            }
            xhr.open(method, path, true);
            xhr.timeout = timeoutMs || 120000;
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4) {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            var payload = JSON.parse(xhr.responseText);
                            if (cacheable) ajaxResponseCache[path] = { data: payload, expires: new Date().getTime() + 60000 };
                            finish(null, payload);
                        } catch (e) { finish(null, null); }
                    } else {
                        try { var err = JSON.parse(xhr.responseText); finish(err.error || 'Error', null); }
                        catch (e) { finish('Error', null); }
                    }
                }
            };
            xhr.onerror = function () { finish('Network error', null); };
            xhr.ontimeout = function () { finish('Request timed out', null); };
            xhr.onabort = function () { finish('Request aborted', null); };
            xhr.send(data ? JSON.stringify(data) : null);
            return xhr;
        }

        function goToPage(direction) {
            var total = Math.max(1, Math.ceil(paginationState.items.length / paginationState.pageSize));
            if (!paginationState.itemRenderer || total <= 1) return;
            if (direction === 'first') paginationState.currentPage = 0;
            if (direction === 'prev' && paginationState.currentPage > 0) paginationState.currentPage--;
            if (direction === 'next' && paginationState.currentPage < total - 1) paginationState.currentPage++;
            if (direction === 'last') paginationState.currentPage = total - 1;

        function elementTopWithin(element, ancestor) {
            var top = 0;
            while (element && element !== ancestor) {
                top += element.offsetTop || 0;
                element = element.offsetParent;
            }
            return top;
        }

        function estimatedItemHeight(itemRenderer) {
            if (itemRenderer === createBookItemDiv || itemRenderer === createDiscoveryBookDiv || itemRenderer === createSearchResultDiv) return 156;
            if (itemRenderer === createAuthorCard || itemRenderer === createSeriesCard) return 116;
            if (itemRenderer === createReleaseItemDiv) return 58;
            return 48;
        }

        function calculatePageSize(targetId, itemRenderer, fallbackPageSize) {
            var content = document.getElementById('content-area');
            var target = document.getElementById(targetId || paginationState.targetId);
            if (!content || !target) return fallbackPageSize || 4;
            var availableHeight = content.clientHeight - elementTopWithin(target, content) - 4;
            if ((targetId === 'opds-content' && itemRenderer !== createBookItemDiv && (librarySection === 'authors' || librarySection === 'series')) || itemRenderer === createStoreAuthorTile) {
                var tileHeight = librarySection === 'series' ? 248 : 228;
                var columns = content.clientWidth > 700 ? 4 : (content.clientWidth > 480 ? 3 : 2);
                return Math.max(columns, Math.floor(availableHeight / tileHeight) * columns);
            }
            var itemHeight = estimatedItemHeight(itemRenderer || paginationState.itemRenderer);

            if (availableHeight <= 0 || itemHeight <= 0) return fallbackPageSize || 4;
            return Math.max(1, Math.floor(availableHeight / itemHeight));
        }

        function updateContextBar() {
            var row = document.getElementById('context-bar-row');
            var left = document.getElementById('ctx-left');
            var center = document.getElementById('ctx-center');
            var right = document.getElementById('ctx-right');

            paginationState.targetId = state.targetId;

        function renderCurrentPage() {

            if (paginationState.currentPage > maxPage) paginationState.currentPage = maxPage;
            updateContextBar();
            updateBottomBar();

            var start = paginationState.currentPage * paginationState.pageSize;
            var end = Math.min(start + paginationState.pageSize, paginationState.items.length);
            var pageItems = paginationState.items.slice(start, end);
            if (paginationState.itemRenderer === createDiscoveryBookDiv) window.discoveryBookRegistry = [];

            for (var i = 0; i < pageItems.length; i++) {

        var activeStoreRequest = null;
        var storeRequestVersion = 0;
        function applyStoreFilters(provider) {
            var state = storeSelection[storeSection];
            var genre = document.getElementById('store-genre');
            var period = document.getElementById('store-period');
            var query = document.getElementById('store-query');
            state.genre = genre ? genre.value : '';
            state.period = period ? period.value : state.period;
            if (query) state.query = query.value.replace(/^\s+|\s+$/g, '');
            var target = document.getElementById('store-list');
            if (!target) return;
            if ((storeSection === 'author' || storeSection === 'book') && !state.query) {
                target.innerHTML = '<center>Enter a search above.</center>';
                return;
            }
            var searchProvider = provider || 'hardcover';
            target.innerHTML = '<center>' + (searchProvider === 'google' ? 'Searching Google Books...' : 'Loading recommendations...') + '</center>';
            var path = '';
            if (storeSection === 'trending') path = '/api/discovery/store-trending?period=' + encodeURIComponent(state.period) + '&genre=' + encodeURIComponent(state.genre);
            if (storeSection === 'popular') path = '/api/discovery/store-popular?period=' + encodeURIComponent(state.period) + '&genre=' + encodeURIComponent(state.genre);
            if (storeSection === 'author') path = '/api/discovery/store-author-search?q=' + encodeURIComponent(state.query) + '&genre=' + encodeURIComponent(state.genre);
            if (storeSection === 'book') path = '/api/discovery/store-book-search?q=' + encodeURIComponent(state.query) + '&genre=' + encodeURIComponent(state.genre) + '&period=' + encodeURIComponent(state.period) + '&provider=' + encodeURIComponent(searchProvider);
            storeRequestVersion++;
            var requestVersion = storeRequestVersion;
            if (activeStoreRequest) { try { activeStoreRequest.abort(); } catch (ignore) {} }
            activeStoreRequest = ajax('GET', path, null, function (err, data) {
                if (requestVersion !== storeRequestVersion) return;
                activeStoreRequest = null;
                if (err || !data) {
                    target.innerHTML = '<center>Unable to load recommendations.</center>';
                    if (storeSection === 'book' && searchProvider === 'hardcover') renderGoogleBooksPrompt(target);

                if (storeSection === 'author') {
                    renderStoreAuthors(data.authors || []);

                    var footer = storeSection === 'book' && searchProvider === 'hardcover' ? renderGoogleBooksPrompt : null;
                    renderStoreBooks(data.title || (storeSection === 'popular' ? 'Popular Books' : 'Search Results'), data.books || [], null, footer);
                }
            });
        }

        function loadStoreBestsellerBooks() {
            var list = document.getElementById('store-bestseller-list');
            var week = document.getElementById('store-bestseller-week');
            var target = document.getElementById('store-list');

        function loadHardcoverGenres(callback) {
            if (hardcoverGenres !== null) {
                callback(true);
                return;
            }
            ajax('GET', '/api/discovery/hardcover-genres', null, function (err, data) {
                if (err || !data || !data.enabled) {
                    hardcoverGenres = [];
                    callback(false);

                hardcoverGenres = data.genres || [];
                callback(true);
            });

        function showHardcoverDiscovery(mode) {
            var content = document.getElementById('discovery-content');
            content.innerHTML = '<center>Loading...</center>';
            loadHardcoverGenres(function (enabled) {
                if (!enabled) {
                    content.innerHTML = '<p>Hardcover discovery requires HARDCOVER_API_KEY.</p>';
                    setContext(mode === 'trending' ? 'Find > Trending' : 'Find > New', renderBrowseMenu);
                    return;
                }
                renderHardcoverControls(mode, true);

        function renderHardcoverControls(mode, autoLoad) {
            var content = document.getElementById('discovery-content');
            var title = mode === 'trending' ? 'Trending' : 'New Releases';
            var selection = mode === 'trending' ? hardcoverSelection.trending : hardcoverSelection.newReleases;
            var html = '<table class="filter-table"><tr>';
            if (mode === 'trending') {
                html += '<td style="width:36%"><select id="hardcover-period">';
                html += '<option value=""' + (!selection.period ? ' selected' : '') + '>Select Timeframe</option>';
                html += '<option value="now"' + (selection.period === 'now' ? ' selected' : '') + '>Now</option>';
                html += '<option value="3m"' + (selection.period === '3m' ? ' selected' : '') + '>Past 3 Months</option>';
                html += '<option value="12m"' + (selection.period === '12m' ? ' selected' : '') + '>Past 12 Months</option>';
                html += '<option value="all"' + (selection.period === 'all' ? ' selected' : '') + '>All Time</option>';
                html += '</select></td>';
            }
            html += '<td style="width:' + (mode === 'trending' ? '44%' : '70%') + '"><select id="hardcover-genre"><option value="">Select Genre</option>';
            for (var i = 0; i < hardcoverGenres.length; i++) {
                html += '<option value="' + escapeHtml(hardcoverGenres[i]) + '"' + (selection.genre === hardcoverGenres[i] ? ' selected' : '') + '>' + escapeHtml(hardcoverGenres[i]) + '</option>';
            }
            html += '</select></td>';
            html += '<td style="width:' + (mode === 'trending' ? '20%' : '30%') + '"><button type="button" class="btn" style="width:100%" onclick="loadHardcoverBooks(\'' + mode + '\')">LOAD</button></td>';
            html += '</tr></table>';
            html += '<div id="hardcover-list"></div>';
            content.innerHTML = html;
            setContext('Find > ' + title, renderBrowseMenu);
            if (autoLoad) loadHardcoverBooks(mode);

        function loadHardcoverBooks(mode) {
            var genreSelect = document.getElementById('hardcover-genre');
            var periodSelect = document.getElementById('hardcover-period');
            var genre = genreSelect ? genreSelect.value : '';
            var selection = mode === 'trending' ? hardcoverSelection.trending : hardcoverSelection.newReleases;
            selection.genre = genre;
            var path;
            if (mode === 'trending') {
                var period = periodSelect ? periodSelect.value : 'now';
                if (!period) period = 'now';
                selection.period = period;
                path = '/api/discovery/hardcover-trending?period=' + encodeURIComponent(period) + '&genre=' + encodeURIComponent(genre);
            } else {
                path = '/api/discovery/hardcover-new-releases?genre=' + encodeURIComponent(genre);
            }
            var listTarget = document.getElementById('hardcover-list');
            if (listTarget) listTarget.innerHTML = '<center>Loading...</center>';
            setContext(mode === 'trending' ? 'Find > Trending' : 'Find > New', renderBrowseMenu);
            ajax('GET', path, null, function (err, data) {
                if (err || !data) {
                    var errorTarget = document.getElementById('hardcover-list');
                    if (errorTarget) errorTarget.innerHTML = '<center>Error loading books</center>';
                    return;
                }
                renderHardcoverBooks(mode, data.title || (mode === 'trending' ? 'Trending' : 'New Releases'), data.books || []);
            });
        }

            discoveryListState = {
                title: title,

                backAction: renderBrowseMenu,
                footerRenderer: null,

                targetId: 'hardcover-list',
                mode: mode
            };

            }
            renderPaginatedList(
                discoveryListState.title,

                createDiscoveryBookDiv,

                discoveryListState.footerRenderer
            );

        function bookAvailabilityLabel(book, defaultAvailability) {
            if (book._queued) return 'DOWNLOADING';
            if (book.library_download_url || book._libraryUrl) return 'AVAILABLE';
            var label = book._availability || defaultAvailability || 'REQUEST NEEDED';
            return label === 'AVAILABLE NOW' ? 'AVAILABLE' : label;
        }

        function standardBookMetaLine(book) {
            var bits = [];
            bits.push(bookAuthorsText(book));
            if (firstGenre(book)) bits.push(firstGenre(book));
            if (book.published_year || book.year) bits.push(book.published_year || book.year);
            if (seriesLabel(book)) bits.push(seriesLabel(book));
            return bits.join(' | ');
        }

        function createStandardBookDiv(book, onSelect, idPrefix, defaultAvailability) {
            var div = document.createElement('div');
            div.className = 'book-row';
            div.onclick = onSelect;
            var cover = book.cover_url || book.coverUrl || noCoverImage;
            var coverId = idPrefix ? ' id="' + idPrefix + '-cover"' : '';
            var metaId = idPrefix ? ' id="' + idPrefix + '-meta"' : '';
            var statusId = idPrefix ? ' id="' + idPrefix + '-status"' : '';
            var descId = idPrefix ? ' id="' + idPrefix + '-desc"' : '';
            var coverHtml = '<div class="book-cover"' + coverId + '><img src="' + escapeHtml(cover) + '" onerror="coverError(this)"></div>';
            var infoHtml = '<div class="book-info">';
            infoHtml += '<div class="book-title"><a href="javascript:void(0)">' + escapeHtml(book.title || 'Unknown Title') + '</a></div>';
            infoHtml += '<div class="book-meta"' + metaId + '>' + escapeHtml(standardBookMetaLine(book)) + '</div>';
            infoHtml += '<div class="book-status"' + statusId + '>' + escapeHtml(bookAvailabilityLabel(book, defaultAvailability)) + '</div>';
            if (book.description) {
                infoHtml += '<a href="javascript:void(0)" class="book-description"' + descId + '>' + escapeHtml(book.description) + '</a>';
            } else {
                infoHtml += '<a href="javascript:void(0)" class="book-description hidden"' + descId + '></a>';
            }
            infoHtml += '</div>';
            div.innerHTML = coverHtml + infoHtml;
            return div;
        }

        function createDiscoveryBookDiv(book) {
            book._listTargetId = paginationState.targetId || 'discovery-content';
            var idx = window.discoveryBookRegistry.push(book) - 1;
            return createStandardBookDiv(book, function () { window.showDiscoveryDetail(idx); }, 'discovery-' + idx, 'CHECKING AVAILABILITY');
        }

        function firstGenre(book) {
            if (!book || !book.genres || !book.genres.length) return '';
            return book.genres[0] || '';
        }

        function applyVisibleBookMetadata(book, idx, metadata) {
            if (!metadata) return false;
            var changed = false;
            var isVisible = window.discoveryBookRegistry[idx] === book;
            if (metadata.description) {
                book.description = metadata.description;
                var description = isVisible ? document.getElementById('discovery-' + idx + '-desc') : null;
                if (description) {
                    description.innerText = metadata.description;
                    description.className = 'book-description';
                }
                changed = true;
            }
            if (!book.cover_url && metadata.cover_url) {
                book.cover_url = metadata.cover_url;
                var cover = isVisible ? document.getElementById('discovery-' + idx + '-cover') : null;
                var images = cover ? cover.getElementsByTagName('img') : [];
                if (images.length) images[0].src = metadata.cover_url;
            }
            if (!book.isbn && metadata.isbn) book.isbn = metadata.isbn;
            if (!book.published_year && metadata.published_year) book.published_year = metadata.published_year;
            var meta = isVisible ? document.getElementById('discovery-' + idx + '-meta') : null;
            if (meta) meta.innerText = standardBookMetaLine(book);
            return changed;
        }

        function enrichVisibleDiscoveryBooks() {
            var pending = [];
            for (var i = 0; i < window.discoveryBookRegistry.length; i++) {
                var book = window.discoveryBookRegistry[i];
                if (!book || book.description || book._descriptionRequested || book.source === 'googlebooks') continue;
                book._descriptionRequested = true;
                pending.push({
                    index: i, title: book.title || '', author: primaryAuthor(book),
                    isbn: book.isbn || '', source: book.source || '',
                    source_id: book.source_id || '', cover_url: book.cover_url || ''
                });
            }
            if (!pending.length) return;
            ajax('POST', '/api/opds/metadata-batch', { books: pending }, function (err, data) {
                if (err || !data || !data.results) return;
                for (var j = 0; j < data.results.length; j++) {
                    var result = data.results[j];
                    var target = window.discoveryBookRegistry[result.index];
                    if (target) applyVisibleBookMetadata(target, result.index, result.metadata || {});
                }
            });
        }

        function checkVisibleDiscoveryBooks() {
            var books = [];
            for (var i = 0; i < window.discoveryBookRegistry.length; i++) {
                var book = window.discoveryBookRegistry[i];
                if (book && !book._libraryChecked) {
                    books.push({ title: book.title, author: primaryAuthor(book), isbn: book.isbn || '' });
                    book._libraryChecked = true;
                }
            }
            if (!books.length) return;
            ajax('POST', '/api/opds/check-library', { books: books }, function (err, data) {
                if (err || !data || !data.results) return;
                for (var j = 0; j < window.discoveryBookRegistry.length; j++) {
                    var item = window.discoveryBookRegistry[j];
                    var info = libraryCheckResultFor(data.results, item);
                    if (!info) continue;
                    item._availability = info.in_library && info.download_url ? 'AVAILABLE NOW' : 'REQUEST NEEDED';
                    item.library_download_url = info.download_url || item.library_download_url;
                    var meta = document.getElementById('discovery-' + j + '-meta');
                    if (meta) meta.innerText = standardBookMetaLine(item);
                    var status = document.getElementById('discovery-' + j + '-status');
                    if (status) status.innerText = bookAvailabilityLabel(item);
                }
            });
        }

        function primaryAuthor(book) {
            return book.author || (book.authors && book.authors.length ? book.authors[0] : '') || '';
        }

        function libraryCheckResultFor(results, book) {
            if (!results || !book) return null;
            if (results[book.title]) return results[book.title];
            var wanted = cleanString(book.title).toLowerCase();
            var keys = Object.keys(results);
            for (var i = 0; i < keys.length; i++) {
                if (cleanString(keys[i]).toLowerCase() === wanted) return results[keys[i]];
            }
            return null;
        }

        function bookAuthorsText(book) {
            if (book.authors && book.authors.length) return book.authors.join(', ');
            if (book.author) return book.author;
            return 'Unknown author';
        }

        function showBookDetail(book, backAction, mode, targetId) {
            if (!book) return;
            discoverySelectedBook = book;
            if (discoveryListState) discoveryListState.currentPage = paginationState.currentPage;
            targetId = targetId || 'discovery-content';
            book._detailTargetId = targetId;
            book._detailMode = mode;
            book._detailBackAction = backAction;
            var content = document.getElementById(targetId);
            if (targetId === 'discovery-content' && currentTab !== 'discover') {
                showTabView('discover');
            }

            var authors = bookAuthorsText(book);
            var detailAvailability = bookAvailabilityLabel(book, mode === 'library' ? 'AVAILABLE NOW' : 'REQUEST NEEDED');
            if (detailAvailability === 'AVAILABLE NOW') detailAvailability = 'AVAILABLE';
            var html = '<div class="detail-card"><h2>' + escapeHtml(book.title || 'Unknown Title') + '</h2>';
            html += '<p class="detail-author">' + escapeHtml(authors) + '</p>';
            html += '<div class="book-detail-summary">';
            html += '<img class="detail-cover" src="' + escapeHtml(book.cover_url || noCoverImage) + '" onerror="coverError(this)">';
            html += '<p class="detail-facts">';
            if (firstGenre(book)) html += '<b>' + escapeHtml(firstGenre(book)) + '</b>';
            if (book.published_year || book.year) html += '<br>Published ' + escapeHtml(book.published_year || book.year);
            if (seriesLabel(book)) html += '<br>' + escapeHtml(seriesLabel(book));
            if (book.isbn) html += '<br>ISBN ' + escapeHtml(book.isbn);
            html += '</p>';
            html += '<p class="detail-status-wrap"><b id="book-detail-status" class="detail-availability">' + escapeHtml(detailAvailability) + '</b></p>';
            html += '</div>';
            html += '<div id="book-detail-action"></div>';
            html += '<div id="book-detail-extra"></div>';
            html += '<p id="book-detail-description">' + escapeHtml(book.description || 'Loading description...') + '</p>';
            html += '<button type="button" class="btn" style="width:100%" onclick="showSelectedBookDescription()">FULL DESCRIPTION</button>';
            html += '</div>';
            content.innerHTML = html;
            setContext('Book Details', backAction || renderDiscoveryMenu);

            loadUnifiedDescription(book);
            if (mode === 'library' || book._inLibrary || book.library_download_url) {
                renderBookDetailActions(book, { in_library: true, download_url: book.library_download_url || book._libraryUrl || book.download_url });
            } else {
                renderBookDetailActions(book, null);
                book._libraryCheckWatchdog = setTimeout(function () {
                    if (book !== discoverySelectedBook) return;
                    var action = document.getElementById('book-detail-action');
                    if (action && action.innerText.toLowerCase().indexOf('checking') !== -1) {
                        renderBookDetailActions(book, { in_library: false });
                    }
                }, 22000);
                try {
                    checkUnifiedLibrary(book);
                } catch (e) {
                    renderBookDetailActions(book, { in_library: false });
                }
            }
        }

        function loadUnifiedDescription(book) {
            var description = document.getElementById('book-detail-description');
            if (!description) return;
            if (book.description) {
                description.innerText = book.description;
                return;
            }
            if (book.source !== 'openlibrary' || !book.source_id) {
                description.innerText = 'No description available.';
                return;
            }
            ajax('GET', '/api/discovery/details?source=openlibrary&source_id=' + encodeURIComponent(book.source_id), null, function (err, data) {
                if (book !== discoverySelectedBook) return;
                var target = document.getElementById('book-detail-description');
                if (!target) return;
                book.description = data && data.description ? data.description : '';
                target.innerText = book.description || 'No description available.';
            });
        }

        function showSelectedBookDescription() {
            var description = discoverySelectedBook && discoverySelectedBook.description ? discoverySelectedBook.description : '';
            if (!description) {
                var descriptionElement = document.getElementById('book-detail-description');
                description = descriptionElement ? descriptionElement.innerText : 'No description available.';
            }
            showModal(description || 'No description available.');
        }

        function checkUnifiedLibrary(book) {
            ajax('POST', '/api/opds/check-library', { books: [{ title: book.title, author: primaryAuthor(book), isbn: book.isbn || '' }] }, function (err, data) {
                if (book !== discoverySelectedBook) return;
                var info = data && data.results ? libraryCheckResultFor(data.results, book) : null;
                renderBookDetailActions(book, info || { in_library: false });
            });
        }

        function renderBookDetailActions(book, info) {
            if (book && book._libraryCheckWatchdog) {
                clearTimeout(book._libraryCheckWatchdog);
                book._libraryCheckWatchdog = null;
            }
            var action = document.getElementById('book-detail-action');
            var extra = document.getElementById('book-detail-extra');
            var status = document.getElementById('book-detail-status');
            if (!action) return;
            if (info === null) {
                if (status) status.innerText = 'CHECKING AVAILABILITY';
                action.innerHTML = '<button type="button" class="btn" style="width:100%" disabled>CHECKING...</button>';
            } else if (info && info.in_library && info.download_url) {
                book.library_download_url = info.download_url;
                book._availability = 'AVAILABLE NOW';
                if (status) status.innerText = 'AVAILABLE';
                action.innerHTML = '<button type="button" class="btn" style="width:100%" onclick="sendSelectedDiscoveryBook()">SEND TO KINDLE</button>';
            } else if (book._queued) {
                if (status) status.innerText = 'DOWNLOADING';
                action.innerHTML = '<button type="button" class="btn" style="width:100%" onclick="switchTab(&quot;queue&quot;)">VIEW DOWNLOADS</button>';
            } else if (book._searchMd5) {
                if (status) status.innerText = 'REQUEST NEEDED';
                action.innerHTML = '<button type="button" class="btn" style="width:100%" onclick="openSelectedSearchReleases()">CHOOSE DOWNLOAD</button>';
            } else {
                if (status) status.innerText = 'REQUEST NEEDED';
                action.innerHTML = '<button type="button" class="btn" style="width:100%" onclick="requestSelectedDiscoveryBook()">REQUEST BOOK</button>';
            }
            if (extra) renderBookDetailExtras(extra, book);
        }

        function renderBookDetailExtras(container, book) {
            container.innerHTML = '';
            var author = primaryAuthor(book);
            if (author) {
                var moreAuthor = document.createElement('button');
                moreAuthor.type = 'button';
                moreAuthor.className = 'btn';
                moreAuthor.style.width = '100%';
                moreAuthor.style.marginTop = '5px';
                moreAuthor.innerText = 'MORE BY AUTHOR';
                moreAuthor.onclick = function () {

            var pathDepth = segments.length;
            if (currentPath.indexOf('://') !== -1) pathDepth -= 2;

            // Author button only shows if we are drilled into an author's list
            // (e.g. /authors/A/AuthorName -> depth 3)

        function enrichVisibleOpdsBooks() {

            for (var i = 0; i < window.opdsBookRegistry.length; i++) {

                if (!book || book._metadataRequested || (book.cover_url && book.description && book.isbn)) continue;

                    if (!book.description && metadata.description) book.description = metadata.description;

        function performSearch(query, fallbackTitle, options) {
            options = options || {};
            var q = (query || document.getElementById('search-input').value || '').trim();
            if (!q) return;
            q = q.replace(/\|/g, ' ').replace(/\s+/g, ' ').trim();

            var results = document.getElementById('search-results');
            var inputDiv = document.getElementById('search-input-container');
            results.innerHTML = '<center>Searching...</center>';
            setContext('Find Books > Results', backFromSearchResults);

            var path = '/api/shelfmark/search?q=' + encodeURIComponent(q);
            if (fallbackTitle) path += '&title=' + encodeURIComponent(fallbackTitle);
            ajax('GET', path, null, function (err, data) {
                if (err || !data || !data.length) {
                    results.innerHTML = '';
                    if (options.fallback) renderShelfmarkFallbackPrompt(results, options.fallback);
                    else results.innerHTML = '<center>No results found.</center>';
                    return;
                }
                inputDiv.className = 'hidden';
                window.searchResultRegistry = []; // Reset reg for new results
                checkShelfmarkResultsLibrary(data, function (books) {
                    books = sortSearchResultsByRelevance(books, fallbackTitle || q, options.author || '');
                    if (options.autoOpenBest) {
                        var best = bestSearchResult(books, fallbackTitle || q, options.author || '');
                        if (best && (best.md5 || best.library_download_url || best._libraryUrl)) {
                            searchStateBackup = { _returnAction: options.returnAction || searchReturnAction || null };
                            var detail = shelfmarkResultToBook(best, searchStateBackup);
                            if (best.md5 && !(best._inLibrary && best._libraryUrl)) {
                                discoverySelectedBook = detail;
                                showReleases(best.md5, searchStateBackup);
                                return;
                            }
                            var detailMode = best._inLibrary && best._libraryUrl ? 'library' : 'discovery';
                            showBookDetail(detail, searchStateBackup._returnAction || backFromSearchResults, detailMode, 'search-results');
                            return;
                        }
                    }
                    var fallbackFooter = options.fallback ? function (container) { renderShelfmarkFallbackPrompt(container, options.fallback); } : null;
                    renderPaginatedList('Results', books, createSearchResultDiv, backFromSearchResults, 'search-results', 4, fallbackFooter);
                });
            });
        }

        function renderShelfmarkFallbackPrompt(container, fallback) {
            if (!container || !fallback) return;
            var prompt = document.createElement('div');
            prompt.className = 'card';
            prompt.style.padding = '8px';
            prompt.style.textAlign = 'center';
            prompt.innerHTML = '<b>NO RESULTS FOUND?</b><br><span class="menu-desc">Try a broader Shelfmark search.</span>';
            var button = document.createElement('button');
            button.type = 'button';
            button.className = 'btn';
            button.style.width = '100%';
            button.style.marginTop = '6px';
            button.innerText = fallback.label;
            button.onclick = fallback.action;
            prompt.appendChild(button);
            container.appendChild(prompt);
        }

        function checkShelfmarkResultsLibrary(books, callback) {
            var queries = [];
            for (var i = 0; i < books.length; i++) {
                queries.push({
                    title: books[i].title,
                    author: books[i].authors && books[i].authors.length ? books[i].authors[0] : '',
                    isbn: books[i].isbn || ''
                });
            }
            ajax('POST', '/api/opds/check-library', { books: queries }, function (err, data) {
                var results = !err && data ? data.results : null;
                for (var j = 0; j < books.length; j++) {
                    var info = libraryCheckResultFor(results, books[j]) || { in_library: false };
                    books[j]._libraryUrl = info.download_url || books[j].library_download_url || '';
                    books[j]._inLibrary = !!info.in_library || !!books[j]._libraryUrl;
                    books[j]._availability = books[j]._inLibrary && books[j]._libraryUrl ? 'AVAILABLE NOW' : 'REQUEST NEEDED';
                }
                callback(books);
            });
        }

        function normalizedWords(value) {
            return cleanString(value).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim().split(' ').filter(function (word) {
                return word && ['a', 'an', 'the', 'and', 'or', 'but'].indexOf(word) === -1;
            });
        }

        function textMatchScore(wanted, candidate) {
            var wantedWords = normalizedWords(wanted);
            var candidateWords = normalizedWords(candidate);
            if (!wantedWords.length || !candidateWords.length) return 0;
            if (wantedWords.join(' ') === candidateWords.join(' ')) return 100;
            var candidateSet = {};
            for (var i = 0; i < candidateWords.length; i++) candidateSet[candidateWords[i]] = true;
            var matches = 0;
            for (var j = 0; j < wantedWords.length; j++) if (candidateSet[wantedWords[j]]) matches++;
            return Math.round((matches / Math.max(wantedWords.length, candidateWords.length)) * 100);
        }

        function bestSearchResult(results, wantedTitle, wantedAuthor) {
            var best = null;
            var bestScore = -1;
            for (var i = 0; i < results.length; i++) {
                var item = results[i];
                var titleScore = textMatchScore(wantedTitle, item.title || '');
                var authorScore = 0;
                if (wantedAuthor && item.authors && item.authors.length) {
                    authorScore = textMatchScore(wantedAuthor, item.authors.join(' '));
                }
                var score = titleScore + Math.min(authorScore, 20);
                if (score > bestScore) {
                    best = item;
                    bestScore = score;
                }
            }
            return bestScore >= 55 ? best : null;
        }

        function searchResultRelevance(item, query, wantedAuthor) {
            var title = item.title || '';
            var authors = item.authors && item.authors.length ? item.authors.join(' ') : '';
            var titleScore = textMatchScore(query, title);
            var authorScore = textMatchScore(wantedAuthor || query, authors);
            var combinedScore = textMatchScore(query, title + ' ' + authors);
            var normalizedQuery = normalizedWords(query).join(' ');
            var normalizedTitle = normalizedWords(title).join(' ');
            var score = Math.max(titleScore * 12, authorScore * 10, combinedScore * 11);

            if (normalizedQuery && normalizedTitle === normalizedQuery) score += 500;
            else if (normalizedQuery && normalizedTitle.indexOf(normalizedQuery) === 0) score += 150;
            if (wantedAuthor && authors) score += Math.min(textMatchScore(wantedAuthor, authors), 100) * 2;
            return score;
        }

        function sortSearchResultsByRelevance(books, query, wantedAuthor) {
            var ranked = [];
            for (var i = 0; i < books.length; i++) {
                ranked.push({
                    book: books[i],
                    index: i,
                    score: searchResultRelevance(books[i], query, wantedAuthor)
                });
            }
            ranked.sort(function (a, b) {
                return b.score - a.score || a.index - b.index;
            });
            var sorted = [];
            for (var j = 0; j < ranked.length; j++) sorted.push(ranked[j].book);
            return sorted;
        }

        function createSearchResultDiv(item) {
            var idx = window.searchResultRegistry.push(item) - 1;
            return createStandardBookDiv(item, function () { window.triggerSearchResultAction(idx); }, 'search-' + idx);
        }

        function shelfmarkResultToBook(item, listState) {
            return {
                title: item.title,
                author: item.authors && item.authors.length ? item.authors[0] : '',
                authors: item.authors || [],
                isbn: item.isbn || '',
                cover_url: item.coverUrl || '',
                description: item.description || '',
                published_year: item.year || item.published_year || '',
                genres: item.genres || [],
                library_download_url: item._libraryUrl || '',
                _inLibrary: !!item._inLibrary,
                _libraryUrl: item._libraryUrl || '',
                _availability: item._availability || '',
                _searchMd5: item.md5,
                _listState: listState
            };
        }

        window.triggerSearchResultAction = function (idx) {
            var item = window.searchResultRegistry[idx];
            if (!item) return;
            var state = captureListState();
            var book = shelfmarkResultToBook(item, state);
            var mode = item._inLibrary && item._libraryUrl ? 'library' : 'discovery';
            showBookDetail(book, function () { restoreListState(state); }, mode, 'search-results');
        };

        function kindleCompatibleReleases(data) {
            return (data || []).filter(function (r) {
                var fmt = (r.format || '').toLowerCase();
                if (fmt.indexOf('epub') !== -1 || fmt.indexOf('mobi') !== -1 || fmt.indexOf('azw3') !== -1) return true;
                var text = ((r.title || '') + ' ' + (r.filename || '') + ' ' + (r.name || '')).toLowerCase();
                return text.indexOf('epub') !== -1 || text.indexOf('mobi') !== -1 || text.indexOf('azw3') !== -1;
            });
        }

        function showReleases(md5, listState) {
            searchStateBackup = listState || {
                items: paginationState.items, currentPage: paginationState.currentPage,
                pageSize: paginationState.pageSize, title: paginationState.title,
                backAction: paginationState.backAction, itemRenderer: paginationState.itemRenderer,
                targetId: paginationState.targetId, footerRenderer: paginationState.footerRenderer
            };

            document.getElementById('view-search').className = 'hidden';
            var container = document.getElementById('releases-container');
            container.className = ''; container.innerHTML = '<center>Loading download options...</center>';
            setContext('Choose Download', backToSearch);

            ajax('GET', '/api/shelfmark/releases?md5=' + encodeURIComponent(md5), null, function (err, data) {
                if (err) {
                    container.innerHTML = '<center>Unable to load download options.<br><small>' + escapeHtml(err) + '</small></center>';
                    return;
                }
                if (!data || !data.length) { container.innerHTML = '<center>No download options found.</center>'; return; }

                // Filter for Kindle-compatible formats (epub, mobi, azw3). Usenet/Prowlarr
                // releases often bundle multiple formats in one file (e.g. format: "epub, mobi",
                // or no format field at all with the extensions only in the title), so fall back
                // to scanning the title/filename when the format field itself doesn't match cleanly.
                var filtered = kindleCompatibleReleases(data);

                if (filtered.length === 0) {
                    container.innerHTML = '<center>No compatible formats (EPUB/MOBI/AZW3) found</center>';
                    return;
                }

                renderPaginatedList('Choose Download', filtered, createReleaseItemDiv, backToSearch, 'releases-container', 5);
            }, 120000);
        }

        function backToSearch() {
            document.getElementById('releases-container').className = 'hidden';
            document.getElementById('view-search').className = '';
            if (searchStateBackup) {
                if (searchStateBackup._returnAction) {
                    var returnAction = searchStateBackup._returnAction;
                    searchStateBackup = null;
                    searchReturnAction = null;
                    returnAction();
                    return;
                }
                restoreListState(searchStateBackup);
            } else {
                setContext('Find Books', renderFindMenu);
            }
        }

        function createReleaseItemDiv(r) {
            var div = document.createElement('div'); div.className = 'opds-item';
            var size = r.size_bytes ? (r.size_bytes / 1024 / 1024).toFixed(1) + 'MB' : (r.size || '');
            var idx = window.releaseRegistry.push(r) - 1;

            var title = r.title || r.filename || 'Unknown Title';

            var html = '<div style="float:right"><button type="button" class="btn" onclick="triggerDownload(' + idx + ')">DOWNLOAD</button></div>';
            html += '<b>' + escapeHtml(title) + '</b><br>';
            html += '<small>' + escapeHtml((r.format || '??').toUpperCase()) + ' • ' + escapeHtml(size) + '</small>';
            div.innerHTML = html;
            return div;
        }

        window.triggerDownload = function (idx) {
            var r = window.releaseRegistry[idx];
            if (r) downloadRelease(r);
        };

        function downloadRelease(r) {
            showToast('Requesting book...');
            ajax('POST', '/api/shelfmark/download', r, function (err, res) {
                if (!err) {
                    showToast('Request submitted');
                    if (discoverySelectedBook) discoverySelectedBook._queued = true;
                    renderQueuedScreen();
                }
                else alert("Error: " + err);
            });
        }

        function renderQueuedScreen() {
            var container = document.getElementById('releases-container');
            container.className = '';
            container.innerHTML = '<center><h3>Request submitted.</h3><p class="section-note">Follow its progress under Downloads or continue browsing.</p></center>';
            var queueBtn = document.createElement('button');
            queueBtn.type = 'button';
            queueBtn.className = 'btn';
            queueBtn.style.width = '100%';
            queueBtn.innerText = 'VIEW DOWNLOADS';
            queueBtn.onclick = function () {
                searchReturnAction = null;
                switchTab('queue');
            };
            container.appendChild(queueBtn);
            var homeBtn = document.createElement('button');
            homeBtn.type = 'button';
            homeBtn.className = 'btn';
            homeBtn.style.width = '100%';
            homeBtn.style.marginTop = '5px';
            homeBtn.innerText = 'HOME';
            homeBtn.onclick = function () {
                searchReturnAction = null;
                switchTab('discover');
            };
            container.appendChild(homeBtn);
            setContext('Request Submitted', returnToDiscoveryAfterQueue);
        }

        function returnToDiscoveryAfterQueue() {
            var returnAction = searchReturnAction;
            searchReturnAction = null;
            document.getElementById('releases-container').className = 'hidden';
            if (returnAction) returnAction();
            else switchTab('discover');
        }

        // --- BSIO Search ---

        function showBSIOSearchMenu() {
            document.getElementById('view-search').className = 'hidden';
            var container = document.getElementById('bsio-search-container');
            container.className = ''; container.innerHTML = '';
            setContext('Authors and Series', renderFindMenu);

            var card = document.createElement('div'); card.style.padding = '10px';
            card.innerHTML = '<h3>Authors and Series</h3><input type="text" id="bsio-input" placeholder="Author or series name..."><button class="btn" style="width:100%" onclick="doBSIOSearch()">SEARCH</button>';
            container.appendChild(card);

            var results = document.createElement('div'); results.id = 'bsio-results';
            container.appendChild(results);
        }

        function doBSIOSearch() {
            var q = document.getElementById('bsio-input').value; if (!q) return;
            var results = document.getElementById('bsio-results');
            results.innerHTML = '<center>Searching...</center>';
            ajax('GET', '/api/bookseriesinorder/search?q=' + encodeURIComponent(q), null, function (err, data) {
                if (err || !data || !data.length) { results.innerHTML = '<center>No results</center>'; return; }
                renderPaginatedList('Authors', data, function (a) {
                    var div = document.createElement('div'); div.className = 'opds-item';
                    div.innerHTML = '<b>' + escapeHtml(a.name) + '</b><br><small>' + escapeHtml(a.description || '') + '</small>';
                    div.onclick = function () { fetchScrapedBooks(a.name, 'search', a.url); };
                    return div;
                }, showBSIOSearchMenu, 'bsio-results', 10);
            });
        }

        // --- Queue ---

        function downloadStatusLabel(status) {
            var labels = {
                queued: 'WAITING TO DOWNLOAD',
                downloading: 'DOWNLOADING',
                delayed: 'WAITING TO RETRY',
                available: 'READY',
                done: 'READY',
                error: 'FAILED',
                cancelled: 'CANCELLED'
            };
            return labels[status] || String(status || 'UNKNOWN').toUpperCase();
        }

        function downloadSectionTitle(status) {
            if (status === 'downloading' || status === 'queued' || status === 'delayed') return 'IN PROGRESS';
            if (status === 'available' || status === 'done') return 'READY';
            return 'NEEDS ATTENTION';
        }

        function refreshQueue() {
            var list = document.getElementById('queue-list');
            list.innerHTML = '<center>Loading...</center>';
            setContext('Downloads', renderDiscoveryMenu);
            ajax('GET', '/api/shelfmark/queue', null, function (err, res) {
                list.innerHTML = '<button type="button" class="btn" style="width:100%; margin-bottom:5px;" onclick="refreshQueue()">REFRESH DOWNLOADS</button>';
                if (err || !res) { list.innerHTML += '<center>Unable to load downloads. Tap Refresh to try again.</center>'; return; }
                var all = [];
                var cats = ['downloading', 'queued', 'delayed', 'available', 'done', 'error', 'cancelled'];
                for (var i = 0; i < cats.length; i++) {
                    var c = cats[i];
                    if (res[c]) for (var md5 in res[c]) { var item = res[c][md5]; item.status = c; all.push(item); }
                }
                if (all.length === 0) { list.innerHTML += '<center>No downloads yet.</center>'; return; }
                var previousSection = '';
                for (var i = 0; i < all.length; i++) {
                    var item = all[i];
                    var section = downloadSectionTitle(item.status);
                    if (section !== previousSection) {
                        var heading = document.createElement('h3');
                        heading.innerText = section;
                        heading.style.margin = '8px 0 4px 0';
                        list.appendChild(heading);
                        previousSection = section;
                    }
                    var div = document.createElement('div'); div.className = 'opds-item';
                    var status = downloadStatusLabel(item.status);
                    if (item.status_message) status += '<br><small style="color:' + (item.status === 'error' ? 'red' : '#666') + '">' + escapeHtml(item.status_message) + '</small>';
                    div.innerHTML = '<b>' + escapeHtml(item.title || item.filename || 'Unknown') + '</b><br><small>' + status + '</small>';
                    if (item.status === 'error') {
                        div.innerHTML += '<br><small class="menu-desc">Tap to search again</small>';
                        div.onclick = (function (failedItem) {
                            return function () {
                                switchTab('search');
                                var q = failedItem.title || failedItem.filename || '';
                                document.getElementById('search-input').value = q;
                                performSearch(q);
                            };
                        })(item);
                    } else if (item.status === 'done' || item.status === 'available') {
                        div.innerHTML += '<br><small class="menu-desc">Tap to find it in My Library</small>';
                        div.onclick = function () { switchTab('cloud'); };
                    }
                    list.appendChild(div);
                }
            });
        }

        // --- Settings ---

        function loadSettings() {
            setContext('Settings');
            ajax('GET', '/api/settings', null, function (err, data) {
                if (data) document.getElementById('kindle-email').value = data.kindle_email || '';
            });
        }

        function saveSettings() {
            var email = document.getElementById('kindle-email').value.trim();
            if (!email || email.indexOf('@') < 1) {
                alert('Enter a valid Kindle email address.');
                return;
            }
            ajax('POST', '/api/settings', { kindle_email: email }, function (err, res) {
                if (!err) showToast('Kindle email saved');
            });
        }

        // --- Modals ---

        function showModal(content) {
            document.getElementById('modal-text').innerText = content;
            document.getElementById('desc-modal').style.display = 'block';
        }

        function closeModal() { document.getElementById('desc-modal').style.display = 'none'; }

        function showConfirmModal(url, title) {
            window.confirmUrl = url;
            document.getElementById('confirm-text').innerText = "Send '" + title + "' to Kindle?";
            document.getElementById('confirm-modal').style.display = 'block';
        }

        function closeConfirmModal() { document.getElementById('confirm-modal').style.display = 'none'; }

        function sendConfirmToKindle() {
            if (window.confirmUrl) sendToKindle(window.confirmUrl);
            closeConfirmModal();
        }

        // --- Init ---
        fitViewport();
        window.onresize = refreshViewport;
        window.onorientationchange = refreshViewport;
        switchTab('cloud');
    </script>
</body>
