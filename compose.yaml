services:
  bookstack:
    build: .
    container_name: bookstack
    environment:
      - SHELFMARK_URL=${SHELFMARK_URL}
      - BOOKLORE_URL=${BOOKLORE_URL}
      - BOOKLORE_USER=${BOOKLORE_USER}
      - BOOKLORE_PASS=${BOOKLORE_PASS}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OPENLIBRARY_CONTACT=${OPENLIBRARY_CONTACT}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - NYT_BOOKS_API_KEY=${NYT_BOOKS_API_KEY}
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY}
      - MAX_KINDLE_ATTACHMENT_MB=${MAX_KINDLE_ATTACHMENT_MB}
    depends_on:
      - shelfmark
      - booklore
    volumes:
      - ${BOOKSTACK_INSTALL}/bookstack/cache:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookstack.rule=Host(`${BOOKSTACK_HOSTNAME}`)"
      - "traefik.http.routers.bookstack.tls=true"
      - "traefik.http.services.bookstack.loadbalancer.server.port=5000"
      - "traefik.http.routers.bookstack.tls.certresolver=letsencrypt"
    profiles:
      - required
      - all

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "127.0.0.1:9696:9696"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${BOOKSTACK_INSTALL}/prowlarr/config:/config
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    profiles:
      - required
      - all

  booklore:
    image: grimmory/grimmory:latest
    container_name: booklore
    environment:
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - BOOKLORE_PORT=${BOOKLORE_PORT}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${BOOKSTACK_INSTALL}/booklore/data:/app/data
      - ${BOOK_LIBRARY}:/books
      - ${INGEST_FOLDER}:/bookdrop
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.booklore.rule=Host(`${BOOKLORE_HOSTNAME?}`)"
      - "traefik.http.routers.booklore.tls=true"
      - "traefik.http.services.booklore.loadbalancer.server.port=${BOOKLORE_PORT}"
      - "traefik.http.routers.booklore.tls.certresolver=letsencrypt"
    profiles:
      - required
      - all


  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.5
    container_name: mariadb
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${BOOKSTACK_INSTALL}/mariadb/config:/config
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    container_name: shelfmark
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - FLASK_PORT=${SHELFMARK_PORT}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AA_BASE_URL=${AA_BASE_URL}
      - AA_MIRROR_URLS=${AA_MIRROR_URLS}
      - LIBGEN_MIRROR_URLS=${LIBGEN_MIRROR_URLS}
      - ZLIB_MIRROR_URLS=${ZLIB_MIRROR_URLS}
      - USING_TOR=${USING_TOR}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    volumes:
      - ${BOOK_LIBRARY}:/books
      - ${DOWNLOAD_FOLDER}:/downloads
      - ${BOOKSTACK_INSTALL}/shelfmark/config:/config
    labels:
      - "traefik.enable=false"
    profiles:
      - required
      - all

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${BOOKSTACK_INSTALL}/sabnzbd:/config
      - ${BOOKSTACK_INSTALL}/sabnzbd/Downloads/incomplete:/incomplete-downloads
      - ${BOOKSTACK_INSTALL}/sabnzbd/Downloads/complete:/downloads
    labels:
      - "traefik.enable=false"
    restart: unless-stopped
    profiles:
      - required
      - all
