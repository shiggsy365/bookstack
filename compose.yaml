services:
  bookstack:
    image: ghcr.io/shiggsy365/bookstack:latest
    build:
      context: .
    environment:
      - SHELFMARK_URL=${SHELFMARK_URL}
      - GRIMMORY_URL=${GRIMMORY_URL}
      - GRIMMORY_USER=${GRIMMORY_USER}
      - GRIMMORY_PASS=${GRIMMORY_PASS}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - OPENLIBRARY_CONTACT=${OPENLIBRARY_CONTACT}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY}
      - NYT_BOOKS_API_KEY=${NYT_BOOKS_API_KEY}
      - HARDCOVER_API_KEY=${HARDCOVER_API_KEY}
      - MAX_KINDLE_ATTACHMENT_MB=${MAX_KINDLE_ATTACHMENT_MB}
    depends_on:
      shelfmark:
        condition: service_healthy
      grimmory:
        condition: service_healthy
    volumes:
      - ${BOOKSTACK_INSTALL}/bookstack/cache:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bookstack.rule=Host(`${BOOKSTACK_HOSTNAME}`)"
      - "traefik.http.routers.bookstack.tls=true"
      - "traefik.http.services.bookstack.loadbalancer.server.port=5000"
      - "traefik.http.routers.bookstack.tls.certresolver=letsencrypt"

  grimmory:
    image: grimmory/grimmory:latest
    environment:
      - USER_ID=${PUID}
      - GROUP_ID=${PGID}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - SERVER_PORT=${GRIMMORY_PORT}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - ${BOOKSTACK_INSTALL}/grimmory/data:/app/data
      - ${BOOK_LIBRARY}:/books
      - ${BOOK_INBOX}:/bookdrop
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "${GRIMMORY_PORT}" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grimmory.rule=Host(`${GRIMMORY_HOSTNAME?}`)"
      - "traefik.http.routers.grimmory.tls=true"
      - "traefik.http.services.grimmory.loadbalancer.server.port=${GRIMMORY_PORT}"
      - "traefik.http.routers.grimmory.tls.certresolver=letsencrypt"

  mariadb:
    image: lscr.io/linuxserver/mariadb:11.4.5
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - ${BOOKSTACK_INSTALL}/mariadb/config:/config
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 5s
      retries: 10
  
  shelfmark:
    image: ghcr.io/calibrain/shelfmark:latest
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      - FLASK_PORT=${SHELFMARK_PORT}
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - AA_BASE_URL=${AA_BASE_URL}
      - AA_MIRROR_URLS=${AA_MIRROR_URLS}
      - LIBGEN_MIRROR_URLS=${LIBGEN_MIRROR_URLS}
      - ZLIB_MIRROR_URLS=${ZLIB_MIRROR_URLS}
      - USING_TOR=${USING_TOR}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', ${SHELFMARK_PORT}), 3).close()" ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ${BOOK_LIBRARY}:/books
      - ${BOOK_LIBRARY}:/downloads
      - ${BOOKSTACK_INSTALL}/shelfmark/config:/config
    labels:
      - "traefik.enable=false"
